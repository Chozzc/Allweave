# Layer applied when a dsh profile lists the `dsh-tongflow` bundle
# (`dsh plugin --profile web add dsh-tongflow`). Users override any of these
# rows by id in their profile's cordis.patch.yml.
- insert:
    - id: tongflow
      name: dsh-tongflow
      config: {}

# The Studio replaces the chat view; the trajectory tab is not needed either,
# so the session shows a single view and no tab bar. Re-enable it in your
# profile patch (`- id: ui-trajectory` / `disabled: false`) if you want it back.
- id: ui-trajectory
  disabled: true
