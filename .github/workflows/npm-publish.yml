# Publish the workspace npm packages via npm Trusted Publishing (OIDC): no
# token, no 2FA prompt, provenance attached.
#
#   packages/tongflow      npm "tongflow"      tag  npm-vX.Y.Z
#   packages/dsh-tongflow  npm "dsh-tongflow"  tag  dsh-npm-vX.Y.Z
#
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
# GitHub Actions, owner `tong-io`, repository `tongflow`, workflow filename
# `npm-publish.yml`, environment `npm`.
#
# Trigger: push the package's tag whose version matches its package.json (or
# run manually with `dry_run` and pick the package).
name: npm publish

on:
  push:
    tags: ["npm-v*", "dsh-npm-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Which package"
        type: choice
        options: [tongflow, dsh-tongflow]
        default: tongflow
      dry_run:
        description: "Build + pack only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    name: Build, test, publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      # dsh-npm-v* tags publish packages/dsh-tongflow; npm-v* tags publish packages/tongflow.
      PKG_DIR: ${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'dsh-npm-v')) && 'packages/dsh-tongflow' || (github.event_name == 'workflow_dispatch' && inputs.package == 'dsh-tongflow') && 'packages/dsh-tongflow' || 'packages/tongflow' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        working-directory: ${{ env.PKG_DIR }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#dsh-npm-v}"
          TAG_VERSION="${TAG_VERSION#npm-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # dsh-tongflow consumes tongflow's built dist; build the workspace deps first.
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Typecheck and test
        working-directory: ${{ env.PKG_DIR }}
        run: pnpm typecheck && pnpm test

      - name: Pack (dry run)
        working-directory: ${{ env.PKG_DIR }}
        run: npm pack --dry-run

      - name: Publish
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        working-directory: ${{ env.PKG_DIR }}
        run: npm publish --access public --provenance
